<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel de Automação de Vouchers</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #f3f4f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 1rem; }
    .container { background: white; padding: 2rem; border-radius: 10px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); width: 100%; max-width: 580px; }
    h2 { margin-top: 0; color: #111827; font-size: 1.5rem; margin-bottom: 0.5rem; }
    p.subtitle { color: #6b7280; font-size: 0.875rem; margin-bottom: 1.5rem; }
    
    .section-title { font-weight: 600; color: #374151; margin-bottom: 0.5rem; font-size: 0.875rem; display: block; }
    
    .radio-grid { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 0.5rem; }
    .radio-option { display: flex; align-items: center; gap: 0.5rem; background: #f9fafb; border: 1px solid #d1d5db; padding: 0.5rem 0.75rem; border-radius: 6px; cursor: pointer; font-size: 0.9rem; transition: all 0.2s ease; }
    .radio-option:hover { background: #f3f4f6; border-color: #9ca3af; }
    .radio-option input[type="radio"] { margin: 0; cursor: pointer; accent-color: #2563eb; }

    .flag-img { width: 20px; height: 15px; object-fit: cover; border-radius: 2px; box-shadow: 0 1px 2px rgba(0,0,0,0.15); }

    .form-group { margin-bottom: 1.25rem; }
    select, textarea { width: 100%; padding: 0.75rem; border: 1px solid #d1d5db; border-radius: 6px; font-size: 0.95rem; background-color: #fff; }
    select { cursor: pointer; }
    textarea { resize: vertical; min-height: 100px; }
    select:focus, textarea:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2); }
    
    button { display: flex; align-items: center; justify-content: center; gap: 0.5rem; width: 100%; background-color: #2563eb; color: white; border: none; padding: 0.75rem; border-radius: 6px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    button:hover { background-color: #1d4ed8; }
    button:disabled { background-color: #9ca3af; cursor: not-allowed; }
    
    .spinner {
      width: 18px;
      height: 18px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #ffffff;
      animation: spin 0.8s linear infinite;
    }
    .spinner-blue {
      border: 3px solid #bfdbfe;
      border-top-color: #2563eb;
      display: inline-block;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .result-box { margin-top: 1.5rem; padding: 1rem; border-radius: 6px; display: none; font-size: 0.875rem; }
    .result-box.active { display: block; }
    .result-box.loading { background-color: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; }
    .result-box.success { background-color: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
    .result-box.error { background-color: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
    pre { white-space: pre-wrap; word-break: break-all; margin: 0.5rem 0 0 0; font-family: monospace; background: rgba(0, 0, 0, 0.04); padding: 0.5rem; border-radius: 4px; }
  </style>
</head>
<body>

  <div class="container">
    <h2>Executar Pipeline de Vouchers</h2>
    <p class="subtitle">Selecione o contexto, insira os vouchers e acione a automação no Azure.</p>
    
    <form id="voucherForm">
      
      <div class="form-group">
        <span class="section-title">1. Selecione o País:</span>
        <div class="radio-grid">
          <label class="radio-option"><input type="radio" name="pais" value="ar"> <img src="https://flagcdn.com/w40/ar.png" class="flag-img" alt="Argentina"> Argentina</label>
          <label class="radio-option"><input type="radio" name="pais" value="pe"> <img src="https://flagcdn.com/w40/pe.png" class="flag-img" alt="Peru"> Peru</label>
          <label class="radio-option"><input type="radio" name="pais" value="py" checked> <img src="https://flagcdn.com/w40/py.png" class="flag-img" alt="Paraguay"> Paraguay</label>
          <label class="radio-option"><input type="radio" name="pais" value="cl"> <img src="https://flagcdn.com/w40/cl.png" class="flag-img" alt="Chile"> Chile</label>
          <label class="radio-option"><input type="radio" name="pais" value="bo"> <img src="https://flagcdn.com/w40/bo.png" class="flag-img" alt="Bolivia"> Bolivia</label>
        </div>
      </div>

      <div class="form-group">
        <label for="ambiente" class="section-title">2. Selecione o Ambiente:</label>
        <select id="ambiente" required>
          <option value="qa">qa</option>
          <option value="beta">beta</option>
        </select>
      </div>

      <div class="form-group">
        <span class="section-title">3. O que você quer validar?</span>
        <div class="radio-grid">
          <label class="radio-option"><input type="radio" name="tipoValidacao" value="candy"> Candy</label>
          <label class="radio-option"><input type="radio" name="tipoValidacao" value="movie" checked> Movie</label>
        </div>
      </div>

      <div class="form-group">
        <label for="vouchers" class="section-title">4. Lista de Vouchers (um por linha):</label>
        <textarea id="vouchers" placeholder="VOUCHER1&#10;VOUCHER2" required></textarea>
      </div>
      
      <button type="submit" id="btnSubmit">
        <span id="btnSpinner" class="spinner" style="display: none;"></span>
        <span id="btnText">Processar Vouchers</span>
      </button>
    </form>

    <div id="resultBox" class="result-box">
      <strong id="statusText"></strong>
      <pre id="outputData"></pre>
    </div>
  </div>

  <script>
    const AZURE_DEVOPS_ORG = "cinemarkintl";
    const AZURE_DEVOPS_PROJECT = "WebApp";
    const PIPELINE_ID = "146";
    const PAT_TOKEN = "BzYeuhxY3OiQ4bqFFiAp8tUAiJaN0QN4NaFYNhM4eiGeWpHow5uEJQQJ99CHACAAAAAfPvCOAAASAZDO3Zaf";

    const form = document.getElementById('voucherForm');
    const btnSubmit = document.getElementById('btnSubmit');
    const btnSpinner = document.getElementById('btnSpinner');
    const btnText = document.getElementById('btnText');
    const resultBox = document.getElementById('resultBox');
    const statusText = document.getElementById('statusText');
    const outputData = document.getElementById('outputData');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const pais = document.querySelector('input[name="pais"]:checked').value;
      const ambiente = document.getElementById('ambiente').value;
      const tipoValidacao = document.querySelector('input[name="tipoValidacao"]:checked').value;
      const rawText = document.getElementById('vouchers').value;
      
      const vouchersList = rawText.split('\n').map(v => v.trim()).filter(v => v.length > 0).join(',');

      if (!vouchersList) return;

      btnSubmit.disabled = true;
      btnSpinner.style.display = 'inline-block';
      btnText.innerText = 'Disparando Pipeline...';
      
      resultBox.className = 'result-box loading active';
      statusText.innerHTML = `<span class="spinner spinner-blue"></span> Processando vouchers...`;
      outputData.innerText = 'Conectando à API...';

      const payload = {
        resources: { repositories: { self: { refName: 'refs/heads/main' } } },
        templateParameters: {
          pais: pais,
          ambiente: ambiente,
          validacao: tipoValidacao,
          vouchers: vouchersList
        }
      };

      // Alterado proxy para thingproxy como alternativa caso o corsproxy esteja bloqueando
      const azureUrl = `https://dev.azure.com/${AZURE_DEVOPS_ORG}/${AZURE_DEVOPS_PROJECT}/_apis/pipelines/${PIPELINE_ID}/runs?api-version=7.0`;
      const proxyUrl = `https://corsproxy.io/?` + encodeURIComponent(azureUrl);

      try {
        const response = await fetch(proxyUrl, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json', // <--- Garante que o Azure não envie página HTML
            'Authorization': 'Basic ' + btoa(':' + PAT_TOKEN)
          },
          body: JSON.stringify(payload)
        });

        // LÊ O TEXTO BRUTO PRIMEIRO (Evita o erro de JSON)
        const responseText = await response.text();
        
        let data;
        try {
          data = JSON.parse(responseText); // Tenta converter para objeto
        } catch (jsonError) {
          throw new Error(`O servidor respondeu com formato inválido.\nStatus HTTP: ${response.status}\nResposta Bruta: ${responseText.substring(0, 150)}...`);
        }

        if (response.ok) {
          resultBox.className = 'result-box success active';
          statusText.innerText = '✅ Pipeline acionada com sucesso!';
          outputData.innerHTML = `ID: ${data.id}\nStatus: ${data.state}\n👉 <a href="${data._links.web.href}" target="_blank" style="color:#15803d; font-weight:bold;">Acompanhar no Azure</a>`;
        } else {
          throw new Error(`Erro do Azure (${response.status}): ${data.message || JSON.stringify(data)}`);
        }

      } catch (error) {
        resultBox.className = 'result-box error active';
        statusText.innerText = '❌ Falha ao acionar:';
        outputData.innerText = error.message;
      } finally {
        btnSubmit.disabled = false;
        btnSpinner.style.display = 'none';
        btnText.innerText = 'Processar Vouchers';
      }
    });
  </script>
</body>
</html>
