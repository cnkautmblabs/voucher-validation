<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bulk Voucher Validator</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #f3f4f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 1rem; }
    .container { background: white; padding: 2rem; border-radius: 10px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); width: 100%; max-width: 620px; }
    h2 { margin-top: 0; color: #111827; font-size: 1.5rem; margin-bottom: 0.25rem; }
    p.subtitle { color: #6b7280; font-size: 0.875rem; margin-bottom: 1.5rem; }
    
    .section-title { font-weight: 600; color: #374151; margin-bottom: 0.5rem; font-size: 0.875rem; display: flex; justify-content: space-between; align-items: center; }
    .radio-grid { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 0.5rem; }
    .radio-option { display: flex; align-items: center; gap: 0.5rem; background: #f9fafb; border: 1px solid #d1d5db; padding: 0.5rem 0.75rem; border-radius: 6px; cursor: pointer; font-size: 0.9rem; transition: all 0.2s ease; }
    .radio-option:hover { background: #f3f4f6; border-color: #9ca3af; }
    .flag-img { width: 20px; height: 15px; object-fit: cover; border-radius: 2px; }

    .radio-option.disabled { opacity: 0.5; cursor: not-allowed; background: #e5e7eb; border-color: #d1d5db; }
    .radio-option.disabled input { cursor: not-allowed; }

    .form-group { margin-bottom: 1.25rem; }
    select, textarea { width: 100%; padding: 0.75rem; border: 1px solid #d1d5db; border-radius: 6px; font-size: 0.95rem; background-color: #fff; }
    textarea { resize: vertical; min-height: 120px; font-family: monospace; }
    select:focus, textarea:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2); }
    
    .counter-badge { background: #e5e7eb; color: #374151; padding: 0.2rem 0.6rem; border-radius: 999px; font-size: 0.75rem; font-weight: bold; }
    .counter-badge.active { background: #dbeafe; color: #1e40af; }

    button { display: flex; align-items: center; justify-content: center; gap: 0.5rem; width: 100%; background-color: #2563eb; color: white; border: none; padding: 0.75rem; border-radius: 6px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    button:hover { background-color: #1d4ed8; }
    button:disabled { background-color: #9ca3af; cursor: not-allowed; }

    .progress-card { background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 8px; padding: 1.25rem; margin-top: 1.5rem; display: none; }
    .progress-card.active { display: block; }
    .progress-title { font-weight: 600; color: #1e40af; font-size: 0.95rem; margin-bottom: 0.5rem; display: flex; justify-content: space-between; align-items: center; }
    .timer-badge { background: #2563eb; color: white; padding: 0.15rem 0.5rem; border-radius: 4px; font-size: 0.8rem; font-family: monospace; }
    
    .progress-bar-bg { background: #dbeafe; border-radius: 999px; height: 8px; overflow: hidden; margin-bottom: 0.5rem; }
    .progress-bar-fill { background: #2563eb; height: 100%; width: 100%; animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 0% { opacity: 0.4; } 50% { opacity: 1; } 100% { opacity: 0.4; } }

    .result-card { margin-top: 1.5rem; padding: 1.25rem; border-radius: 8px; display: none; }
    .result-card.active { display: block; }
    .result-card.success { background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534; }
    .result-card.error { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; }
    .result-header { font-weight: bold; font-size: 1rem; margin-bottom: 0.5rem; display: flex; justify-content: space-between; align-items: center; }
    pre.output-box { background: rgba(0, 0, 0, 0.05); padding: 0.75rem; border-radius: 6px; white-space: pre-wrap; word-break: break-all; max-height: 200px; overflow-y: auto; font-size: 0.875rem; margin-top: 0.5rem; }
  </style>
</head>
<body>

  <div class="container">
    <h2>Bulk Voucher Validator</h2>
    <p class="subtitle">Select the context, paste vouchers in bulk (any format), and validate instantly.</p>
    
    <form id="voucherForm">
      <div class="form-group">
        <span class="section-title">1. Select the Country:</span>
        <div class="radio-grid">
          <label class="radio-option"><input type="radio" name="pais" value="ar" required> <img src="https://flagcdn.com/w40/ar.png" class="flag-img"> Argentina</label>
          <label class="radio-option"><input type="radio" name="pais" value="bo" required> <img src="https://flagcdn.com/w40/bo.png" class="flag-img"> Bolivia</label>
          <label class="radio-option"><input type="radio" name="pais" value="cl" required> <img src="https://flagcdn.com/w40/cl.png" class="flag-img"> Chile</label>
          <label class="radio-option"><input type="radio" name="pais" value="py" required> <img src="https://flagcdn.com/w40/py.png" class="flag-img"> Paraguay</label>
          <label class="radio-option"><input type="radio" name="pais" value="pe" required> <img src="https://flagcdn.com/w40/pe.png" class="flag-img"> Peru</label>
        </div>
      </div>

      <div class="form-group">
        <label for="ambiente" class="section-title">2. Select the Environment:</label>
        <select id="ambiente" required>
          <option value="" disabled selected hidden>Choose environment...</option>
          <option value="qa">QA</option>
          <option value="beta">Beta</option>
        </select>
      </div>

      <div class="form-group">
        <span class="section-title">3. What do you want to validate?</span>
        <div class="radio-grid">
          <label class="radio-option disabled" id="ticketOptionWrapper">
            <input type="radio" name="tipoValidacao" id="radioTicket" value="movie" disabled> Ticket
          </label>
          <label class="radio-option">
            <input type="radio" name="tipoValidacao" id="radioCandy" value="candy" required checked> Candy
          </label>
        </div>
      </div>

      <div class="form-group">
        <label for="vouchers" class="section-title">
          4. Voucher List (paste any format):
          <span id="voucherCount" class="counter-badge">0 identified</span>
        </label>
        <textarea id="vouchers" placeholder="VOUCHER1&#10;VOUCHER2&#10;VOUCHER3" required></textarea>
      </div>
      
      <button type="submit" id="btnSubmit">Start Validation</button>
    </form>

    <div id="progressCard" class="progress-card">
      <div class="progress-title">
        <span>⚡ Validating...</span>
        <span id="liveTimer" class="timer-badge">0.0s</span>
      </div>
      <div class="progress-bar-bg"><div class="progress-bar-fill"></div></div>
      <div id="statusDetail" style="font-size: 0.8rem; color: #4b5563;">Processing requests...</div>
    </div>

    <div id="resultCard" class="result-card">
      <div class="result-header">
        <span id="resultTitle"></span>
        <button id="btnCopy" style="width: auto; padding: 0.25rem 0.75rem; font-size: 0.75rem; display: none;">Copy Valid</button>
      </div>
      <div id="resultContent"></div>
    </div>
  </div>

  <script>
    const WORKER_URL = "https://proxy-vouchers.cnk-aut-mblabs.workers.dev/";

    const form = document.getElementById('voucherForm');
    const btnSubmit = document.getElementById('btnSubmit');
    const progressCard = document.getElementById('progressCard');
    const statusDetail = document.getElementById('statusDetail');
    const liveTimer = document.getElementById('liveTimer');
    const resultCard = document.getElementById('resultCard');
    const resultTitle = document.getElementById('resultTitle');
    const resultContent = document.getElementById('resultContent');
    const btnCopy = document.getElementById('btnCopy');
    
    const txtVouchers = document.getElementById('vouchers');
    const badgeCount = document.getElementById('voucherCount');

    const radioTicket = document.getElementById('radioTicket');
    const radioCandy = document.getElementById('radioCandy');
    const ticketOptionWrapper = document.getElementById('ticketOptionWrapper');
    const countryRadios = document.querySelectorAll('input[name="pais"]');

    // Controle dinâmico: Habilita Ticket apenas para Paraguay (Piloto)
    countryRadios.forEach(radio => {
      radio.addEventListener('change', () => {
        if (radio.value === 'py') {
          radioTicket.disabled = false;
          ticketOptionWrapper.classList.remove('disabled');
        } else {
          radioTicket.disabled = true;
          ticketOptionWrapper.classList.add('disabled');
          radioCandy.checked = true; // Volta para Candy se mudar de país
        }
      });
    });

    let timerInterval = null;
    let startTime = 0;

    function getCleanVouchersList(rawText) {
      const cleanText = rawText.replace(/(\d{3,})([A-Za-z]{2,})/g, '$1 $2');
      let arr = cleanText.split(/[\s,;]+/).map(v => v.trim()).filter(v => v.length > 5);
      return [...new Set(arr)];
    }

    txtVouchers.addEventListener('input', () => {
      const list = getCleanVouchersList(txtVouchers.value);
      badgeCount.innerText = `${list.length} identified`;
      if (list.length > 0) {
        badgeCount.classList.add('active');
      } else {
        badgeCount.classList.remove('active');
      }
    });

    txtVouchers.addEventListener('blur', () => {
      const list = getCleanVouchersList(txtVouchers.value);
      if (list.length > 0) {
        txtVouchers.value = list.join('\n');
      }
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const selectedPais = document.querySelector('input[name="pais"]:checked');
      if (!selectedPais) {
        alert("Please select a country.");
        return;
      }
      const pais = selectedPais.value;

      const ambiente = document.getElementById('ambiente').value;
      if (!ambiente) {
        alert("Please select an environment.");
        return;
      }

      const tipoValidacao = document.querySelector('input[name="tipoValidacao"]:checked').value;

      const vouchersList = getCleanVouchersList(txtVouchers.value);
      if (vouchersList.length === 0) {
        alert("No valid vouchers found in the text field.");
        return;
      }

      btnSubmit.disabled = true;
      resultCard.classList.remove('active');
      progressCard.classList.add('active');

      startTime = Date.now();
      liveTimer.innerText = "0.0s";
      timerInterval = setInterval(() => {
        const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
        liveTimer.innerText = `${elapsed}s`;
      }, 100);

      // Chunks menores (10) para Tickets para evitar timeout de múltiplas sessões
      const chunkSize = tipoValidacao === 'movie' ? 10 : 15;
      const chunks = [];
      for (let i = 0; i < vouchersList.length; i += chunkSize) {
        chunks.push(vouchersList.slice(i, i + chunkSize));
      }

      let allValidVouchers = [];

      try {
        for (let i = 0; i < chunks.length; i++) {
          statusDetail.innerText = `Validating ${tipoValidacao.toUpperCase()} batch ${i + 1} of ${chunks.length} (${chunks[i].length} vouchers)...`;

          const response = await fetch(WORKER_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
              country: pais, 
              env: ambiente, 
              type: tipoValidacao, 
              vouchers: chunks[i] 
            })
          });

          const data = await response.json();

          if (!response.ok) throw new Error(data.message || 'Server proxy error.');

          if (data.validVouchers) {
            allValidVouchers = allValidVouchers.concat(data.validVouchers);
          }
        }

        const totalElapsed = ((Date.now() - startTime) / 1000).toFixed(1);
        showFinalResult(allValidVouchers, totalElapsed);

      } catch (error) {
        showError('Validation Failed', error.message);
      } finally {
        clearInterval(timerInterval);
        btnSubmit.disabled = false;
        progressCard.classList.remove('active');
      }
    });

    function showFinalResult(vouchers, totalTime) {
      resultCard.classList.add('active');
      if (vouchers.length > 0) {
        resultCard.className = 'result-card active success';
        resultTitle.innerText = `✅ Validation Completed in ${totalTime}s! (${vouchers.length} Valid Vouchers)`;
        resultContent.innerHTML = `<p style="margin:0 0 0.5rem 0;">Approved vouchers returned:</p><pre class="output-box">${vouchers.join('\n')}</pre>`;
        btnCopy.style.display = 'block';
        btnCopy.onclick = () => {
          navigator.clipboard.writeText(vouchers.join('\n'));
          btnCopy.innerText = 'Copied!';
          setTimeout(() => btnCopy.innerText = 'Copy Valid', 2000);
        };
      } else {
        resultCard.className = 'result-card active error';
        resultTitle.innerText = `⚠️ Validation Completed in ${totalTime}s! (0 Valid Vouchers)`;
        resultContent.innerHTML = `<p style="margin:0;">No valid vouchers found in this run.</p>`;
        btnCopy.style.display = 'none';
      }
    }

    function showError(title, message) {
      resultCard.className = 'result-card active error';
      resultTitle.innerText = `❌ ${title}`;
      resultContent.innerHTML = `<p style="margin:0;">${message}</p>`;
      btnCopy.style.display = 'none';
    }
  </script>
</body>
</html>
